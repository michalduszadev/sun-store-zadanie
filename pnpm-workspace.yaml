# Only these dependencies may run install scripts (supply-chain hygiene).
# `allowBuilds` is the pnpm 12 setting; `onlyBuiltDependencies` is the same
# for pnpm 9/10, which a build image may pick from lockfileVersion 9.0.
allowBuilds:
  esbuild: true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
